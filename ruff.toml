# The one Ruff config for this project (pyproject.toml has no [tool.ruff] section)
line-length = 120
src = ["src"]
format.quote-style = "single"

# pycodestyle errors (E) and warnings (W), Pyflakes (F), isort (I)
lint.select = ["E", "F", "W", "I"]
lint.ignore = []

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    ".env",
    ".venv",
    "venv",
    "typings/**/*.pyi",
]
lint.per-file-ignores = { }

# Allow unused variables when underscore-prefixed.
# dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Assume Python 3.14.
target-version = "py314"


